site_name: 我的知识库  # 设置网站标题
site_url: https://gitee.com/lzg_6/my-gitee-docs # 后续替换为你的 Gitee Pages URL

# 设置导航栏
nav:
    - 首页: index.md
    - 笔记: 
        - 硬件相关: Tutorial/hard.md
        - 软件相关: Tutorial/soft.md
        - git相关: Tutorial/git.md
        - 其他: Tutorial/other.md
    - 文档:  
        - 文档链接: Document/link.md
    - 关于: about.md  # 如需，可在 docs 下创建 about.md 文件

# 设置侧边栏
sidebar:
    home: index.md
    Tutorial: Tutorial.md
    #- 关于: about.md  # 如需，可在 docs 下创建 about.md 文件

# 选择主题（可选）
theme:
    language: zh  # 设置为简体中文
    name: material    # 取消注释并使用 material 主题
    # 取消下面任意功能的注释以启用
    palette:
        primary: 'blue'   # 主色调
        accent: 'blue'    # 强调色
    features:
        - navigation.tabs
        - navigation.tabs.sticky
        - navigation.tracking
        - navigation.path
        - navigation.top
